<figure class="window" [attr.data-shell]="shell()">
  <figcaption class="titlebar">
    <span class="lights" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="title">{{ prompt().title }}</span>
    <button type="button" class="copy" (click)="copy()" [attr.aria-label]="'Copiar comando de ' + shell()">
      <svg class="copy-icon" viewBox="0 0 16 16" aria-hidden="true">
        @if (copied()) {
          <path d="M3 8.5l3 3 7-7" />
        } @else {
          <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" />
          <path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H4A1.5 1.5 0 0 0 2.5 3v5A1.5 1.5 0 0 0 4 9.5h.5" />
        }
      </svg>
      <span aria-live="polite">{{ copied() ? 'Copiado' : 'Copiar' }}</span>
    </button>
  </figcaption>
  <pre class="screen"><code>@for (line of lines(); track $index) {<span class="line" [attr.data-kind]="line.kind">@if (line.kind === 'input') {<span class="prompt" aria-hidden="true">{{ prompt().main }} </span>} @else if (line.kind === 'continuation') {<span class="prompt" aria-hidden="true">{{ prompt().continuation }} </span>}@for (t of line.tokens; track $index) {<span [class]="'t-' + t.kind">{{ t.text }}</span>}</span>}<span class="line"><span class="prompt" aria-hidden="true">{{ prompt().main }} </span>@if (cursor()) {<span class="cursor" aria-hidden="true"></span>}</span></code></pre>
</figure>
