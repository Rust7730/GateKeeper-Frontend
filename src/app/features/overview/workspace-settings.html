<details
  class="preferences"
  #menu
  tabindex="-1"
  (keydown.escape)="menu.open = false; trigger.focus()"
>
  <summary #trigger>
    <svg
      class="icon icon-gear"
      aria-hidden="true"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="3" />
      <path
        d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
      />
    </svg>
    {{ t('Ajustes', 'Settings') }}
  </summary>
  <div class="preferences-panel">
    <span id="theme-label" class="pref-label">
      <span class="theme-icon" aria-hidden="true">
        <svg
          class="icon icon-sun"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <svg
          class="icon icon-moon"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
      </span>
      {{ t('Tema', 'Theme') }}
    </span>
    <div
      class="theme-switch"
      role="radiogroup"
      aria-labelledby="theme-label"
      [attr.data-value]="preferences.theme()"
    >
      <span class="theme-thumb" aria-hidden="true"></span>
      <label [attr.title]="t('Del sistema', 'System')">
        <input
          type="radio"
          name="dashboard-theme"
          value="system"
          [checked]="preferences.theme() === 'system'"
          (change)="preferences.theme.set('system')"
        />
        <svg
          class="icon"
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="4" width="18" height="12" rx="2" />
          <path d="M8 20h8M12 16v4" />
        </svg>
        <span>{{ t('Sistema', 'System') }}</span>
      </label>
      <label [attr.title]="t('Claro', 'Light')">
        <input
          type="radio"
          name="dashboard-theme"
          value="light"
          [checked]="preferences.theme() === 'light'"
          (change)="preferences.theme.set('light')"
        />
        <svg
          class="icon"
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
        <span>{{ t('Claro', 'Light') }}</span>
      </label>
      <label [attr.title]="t('Oscuro', 'Dark')">
        <input
          type="radio"
          name="dashboard-theme"
          value="dark"
          [checked]="preferences.theme() === 'dark'"
          (change)="preferences.theme.set('dark')"
        />
        <svg
          class="icon"
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
        <span>{{ t('Oscuro', 'Dark') }}</span>
      </label>
    </div>
    <label class="language">
      <span id="dashboard-language-label" class="pref-label"
        ><svg
          class="icon"
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="18"
          height="18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="9" />
          <path
            d="M3 12h18M12 3c2.6 2.6 4 5.7 4 9s-1.4 6.4-4 9c-2.6-2.6-4-5.7-4-9s1.4-6.4 4-9Z"
          /></svg
        >{{ t('Idioma') }}</span
      >
      <select
        aria-labelledby="dashboard-language-label"
        [value]="preferences.language()"
        (change)="preferences.language.set($any($event.target).value)"
      >
        <option value="es" lang="es">Español</option>
        <option value="en" lang="en">English</option>
      </select>
    </label>
    <label class="motion-control"
      ><svg
        class="icon"
        aria-hidden="true"
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 12h4l3-8 4 16 3-8h4" /></svg
      ><input
        type="checkbox"
        [checked]="preferences.reducedMotion()"
        (change)="preferences.reducedMotion.set($any($event.target).checked)"
      />
      {{ t('Reducir movimiento', 'Reduce motion') }}</label
    >
  </div>
</details>
